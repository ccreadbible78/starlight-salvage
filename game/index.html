<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starlight Salvage</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Self-test output (?selftest=1): hidden, read back from the DOM. */
  #test-result { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Starlight Salvage: pilot a salvage drone, collect star shards, dodge asteroids and mines, clear all 8 waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="test-result"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
